# run4ftGAN-cond1 radar AE — 50k LATE-GAN finetune (250k->300k) of run4ft_cond1.
#   resumes from run4ft_cond1/checkpoint-250000 (symlinked into this dir); auto_resume
#   picks it, global_step=250000. discriminator_start=250000 => GAN engages IMMEDIATELY
#   (recon plateaued by 200k, run4ft@250k confirmed net-positive: rFID 0.519->0.449).
#   Generator LR held at FLOOR 1e-5 (force_lr_floor_on_resume); discriminator trains at 1e-4.
#   GAN hyperparams = lab2 radar sweep WINNER: discriminator_weight=0.001 (the ONLY beneficial
#   value; >=0.01 harmful, 1.0 collapses), disc_factor=1.0, lecam=1e-3, disc_lr=1e-4.
# --- inherits run4ft_cond1 base recipe (patch8 + 128 tokens + kl 6.02e-8 + perc 0.6, l2) ---
experiment:
  project: radar_flowtitok_ae_bl128_vae_scratch
  name: radar_flowtitok_ae_bl128_vae_scratch_run4ftgan_cond1_gadi
  output_dir: /scratch/kl02/yh0308/Projv2v/Experiments/radar_flowtitok_ae_bl128_vae_scratch_run4ftgan_cond1_gadi
  max_train_examples: 300000
  save_every: 50000          # only the final checkpoint-300000 (8GB); GAN trajectory is
                             # observable from eval_every=10000 val logs without saving ckpts.
  eval_every: 10000
  generate_every: 5000
  log_every: 1000
  log_grad_norm_every: 1000
  resume: true
  logging_dir: /scratch/kl02/yh0308/Projv2v/Experiments/radar_flowtitok_ae_bl128_vae_scratch_run4ftgan_cond1_gadi/logs

model:
  vq_model:
    quantize_mode: vae
    token_size: 16
    vit_enc_model_size: base
    vit_dec_model_size: large
    vit_enc_patch_size: 8
    vit_dec_patch_size: 8
    num_latent_tokens: 128
    in_channels: 1
    out_channels: 1
    finetune_decoder: false
    is_legacy: false

losses:
  discriminator_start: 250000
  quantizer_weight: 1.0
  discriminator_factor: 1.0
  discriminator_weight: 0.001
  perceptual_loss: lpips-convnext_s-1.0-0.1
  perceptual_weight: 0.6
  reconstruction_loss: l2
  reconstruction_weight: 1.0
  lecam_regularization_weight: 0.001
  kl_weight: 6.02e-08
  logvar_init: 0.0

dataset:
  params:
    filelist_path: /g/data/kl02/yh0308/Data/71/filelists/dataset_filelist_i2i_train_201906_202406_cond1_clip16_p015_seed42.pkl
    filelist_split: train
    mode: radar
    use_lightning: false
    num_workers: 4
  preprocessing:
    resize_shorter_edge: 128
    crop_size: 128
    random_crop: true
    random_flip: true
    res_ratio_filtering: true

optimizer:
  name: adamw
  params:
    learning_rate: 1.0e-05
    discriminator_learning_rate: 0.0001
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0001
    # Generator LR floor on resume (load_state would otherwise restore the checkpoint base
    # LR). Pins ONLY the generator optimizer+scheduler to 1e-5; discriminator keeps 1e-4.
    force_lr_floor_on_resume: true

lr_scheduler:
  scheduler: cosine
  params:
    learning_rate: ${optimizer.params.learning_rate}
    warmup_steps: 10000
    end_lr: 1.0e-05

finetune:
  enabled: false
  text_guidance_from_filename: true

training:
  gradient_accumulation_steps: 1
  per_gpu_batch_size: 64
  mixed_precision: "no"
  enable_tf32: true
  enable_wandb: false
  use_ema: true
  seed: 42
  max_train_steps: 300000
  num_generated_images: 1
  max_grad_norm: 1.0
  nan_check: false
  nan_skip: true
