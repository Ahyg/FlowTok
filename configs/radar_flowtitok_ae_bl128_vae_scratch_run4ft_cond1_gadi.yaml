# run4ft-cond1 radar AE — 50k CONTINUE-FINETUNE of run4 200k on the new cond1_clip16_p015 dataset.
#   resumes from run4/checkpoint-200000 (copied into this dir); trains 200k->250k.
#   filelist: ct005 -> cond1_clip16_p015_seed42 (2019-06..2024-06; 31% dry, clip-coupled).
#   LR: constant FLOOR 1e-5 (optimizer.lr=end_lr=1e-5 => post-warmup cosine multiplier == 1.0, no re-warm).
# --- original run4 header below ---
# run4 radar AE — patches lab2 21-cell sweep winners onto the run1 base+large recipe.
# Deltas vs run1_continue_gadi:
#   vit_enc/dec_patch_size: 16 -> 8        (lab2: radar mse -25.7%, fss 0.50->0.59, rfid 24.6->15.6)
#   num_latent_tokens:       77 -> 128     (lab2: 128 is the elbow; 64/77/256 all worse)
#   kl_weight:           1.0e-6 -> 6.02e-8 (lab2 kl_weight ÷10 winner, normalized to 128 tokens; radar mse -11.5%)
#   perceptual_weight:      1.1 -> 0.6     (lab2 radar best; -5.8% mse — borderline signal, but two-modality direction confirmed)
# All other run1 knobs preserved (GAN off via disc_start=400000, l2, 200k steps, batch 64, cosine, warmup 10k).
experiment:
  project: radar_flowtitok_ae_bl128_vae_scratch
  name: radar_flowtitok_ae_bl128_vae_scratch_run4ft_cond1_gadi
  output_dir: /scratch/kl02/yh0308/Projv2v/Experiments/radar_flowtitok_ae_bl128_vae_scratch_run4ft_cond1_gadi
  max_train_examples: 250000
  save_every: 50000
  eval_every: 10000
  generate_every: 5000
  log_every: 1000
  log_grad_norm_every: 1000
  resume: true
  logging_dir: /scratch/kl02/yh0308/Projv2v/Experiments/radar_flowtitok_ae_bl128_vae_scratch_run4ft_cond1_gadi/logs

model:
  vq_model:
    quantize_mode: vae
    token_size: 16
    vit_enc_model_size: base
    vit_dec_model_size: large
    vit_enc_patch_size: 8
    vit_dec_patch_size: 8
    num_latent_tokens: 128
    in_channels: 1
    out_channels: 1
    finetune_decoder: false
    is_legacy: false

losses:
  discriminator_start: 400000
  quantizer_weight: 1.0
  discriminator_factor: 1.0
  discriminator_weight: 0.1
  perceptual_loss: lpips-convnext_s-1.0-0.1
  perceptual_weight: 0.6
  reconstruction_loss: l2
  reconstruction_weight: 1.0
  lecam_regularization_weight: 0.001
  kl_weight: 6.02e-08
  logvar_init: 0.0

dataset:
  params:
    filelist_path: /g/data/kl02/yh0308/Data/71/filelists/dataset_filelist_i2i_train_201906_202406_cond1_clip16_p015_seed42.pkl
    filelist_split: train
    mode: radar
    use_lightning: false
    num_workers: 4
  preprocessing:
    resize_shorter_edge: 128
    crop_size: 128
    random_crop: true
    random_flip: true
    res_ratio_filtering: true

optimizer:
  name: adamw
  params:
    learning_rate: 1.0e-05
    discriminator_learning_rate: 0.0001
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0001
    # On resume, load_state restores the checkpoint's base LR (1e-4); this pins the
    # optimizer + scheduler base_lrs back to learning_rate (1e-5) for a true constant floor.
    force_lr_floor_on_resume: true

lr_scheduler:
  scheduler: cosine
  params:
    learning_rate: ${optimizer.params.learning_rate}
    warmup_steps: 10000
    end_lr: 1.0e-05

finetune:
  enabled: false
  text_guidance_from_filename: true

training:
  gradient_accumulation_steps: 1
  per_gpu_batch_size: 64
  mixed_precision: "no"
  enable_tf32: true
  enable_wandb: false
  use_ema: true
  seed: 42
  max_train_steps: 250000
  num_generated_images: 1
  max_grad_norm: 1.0
  nan_check: false
  nan_skip: true
